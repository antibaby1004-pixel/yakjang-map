  .hint{font-size:11.5px;color:#c7f0ea;margin-top:7px;line-height:1.5}
  .content{padding:12px}
  .results{list-style:none;margin:0;padding:0}
  .ritem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;cursor:pointer}

  .rname{font-size:15.5px;font-weight:600;line-height:1.3}
  .ren{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.3}

  .cablabel{position:absolute;font-weight:800;color:#334155;pointer-events:none}
  .cell{position:absolute;border:.5px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:10px;color:#334155;font-weight:600;background:#fff;text-align:center;line-height:1.05;overflow:hidden}
  .cell.ward{background:#ecfdf5;color:#065f46;font-weight:800}
  .plannote{position:absolute;font-size:10px;font-weight:800;color:#0369a1;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:5px;padding:2px 5px;white-space:nowrap;pointer-events:none}

  .fridgerow{display:flex;gap:6px;align-items:flex-start;justify-content:center;min-width:min-content}
  .frunit{border:1.5px solid #93c5fd;border-radius:9px;padding:6px 5px 8px;background:#eff6ff;flex:0 0 auto}
  .frunit h4{margin:0 0 6px;font-size:10.5px;color:#1d4ed8;text-align:center;font-weight:800;white-space:nowrap}

  footer{text-align:center;font-size:10.5px;color:#94a3b8;padding:16px}

function parseLoc(loc){const m=loc.match(/^\(([^)]*)\)\s*(.*)$/);return m?{cab:m[1].trim(),coord:m[2].trim()}:{cab:'',coord:loc.trim()};}
const ROOM=['가','나','다','라','마','바','사','아','자','차','카','타'];
const isRoom=c=>ROOM.includes(c);
function norm(s){return (s||'').toLowerCase().replace(/\s+/g,'');}
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text,q){if(!q)return esc(text);const i=norm(text).indexOf(norm(q));if(i<0)return esc(text);
  // map normalized index back approx: simple case-insensitive highlight on raw
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(text).replace(re,'<mark>$1</mark>');}
const results=document.getElementById('results'),countEl=document.getElementById('count'),q=document.getElementById('q'),clr=document.getElementById('clr');
function render(list,query){
  results.innerHTML='';
  if(!query){countEl.textContent='';results.innerHTML='<div class="empty">위에 약 이름을 입력해 보세요.<br><span style="font-size:12px">한글·영문 모두 · 예: 가스터 · lasix · 세포탁심 · vanco</span></div>';return;}
  if(!list.length){countEl.textContent='';results.innerHTML='<div class="empty">🔍 “'+esc(query)+'” 검색 결과가 없어요.</div>';return;}
  countEl.textContent=list.length+'개 결과';
  const nq=norm(query);
  list.slice(0,80).forEach(d=>{
    const p=parseLoc(d.loc);const stc=d.s==='fridge'?'s-fridge':'s-room';const stt=d.s==='fridge'?'냉장':'상온';
    // 검색어가 걸린 쪽을 주 이름으로 (영문으로 검색하면 영문명이 위로)
    const inKo=norm(d.n).includes(nq);
    const primary = inKo? d.n : (d.e||d.n);
    const secondary = inKo? d.e : d.n;
    const li=document.createElement('li');li.className='ritem';
    li.innerHTML='<div style="min-width:0"><div class="rname">'+hl(primary,query)+' <span class="rstore '+stc+'">'+stt+'</span></div>'+
      (secondary?'<div class="ren">'+hl(secondary,query)+'</div>':'')+'</div>'+
      '<div class="rloc"><span class="pill">'+esc(p.cab||'?')+'</span>'+(p.coord?'<div class="co">'+esc(p.coord)+'</div>':'')+'</div>';
    li.onclick=()=>openMap(d);results.appendChild(li);
  });
}
function doSearch(){
  const v=q.value.trim();clr.classList.toggle('show',v.length>0);const nv=norm(v);
  if(!nv){render([],'');return;}
  const sc=[];
  for(const d of DRUGS){
    const n=norm(d.n),e=norm(d.e);let s=99;
    if(n===nv||e===nv)s=0;else if(n.startsWith(nv)||e.startsWith(nv))s=1;else if(n.includes(nv)||e.includes(nv))s=2;
    if(s<99)sc.push([s,d]);
  }
  sc.sort((a,b)=>a[0]-b[0]||a[1].n.localeCompare(b[1].n,'ko'));
  render(sc.map(x=>x[1]),v);
}

   html+=cd(name,'A-1',c.x+4,c.y+4,w1,26,'A-1')+cd(name,'A-2',c.x+4,c.y+34,w1,26,'A-2')+cd(name,'B-1',c.x+8+w1,c.y+4,w1,26,'B-1')+cd(name,'B-2',c.x+8+w1,c.y+34,w1,26,'B-2');
  }else if(c.type==='bar'){const hit=hk&&hk.cab===name;html+='<div class="cab" style="left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:20px;'+(hit?'background:var(--hl);border-color:#b45309':'')+'"></div>';
  }else if(c.type==='box'){const hit=hk&&hk.cab===name;html+='<div class="cell'+(hit?' hit':'')+'" style="left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:36px">'+(hit?'📍 '+name:name)+'</div>';}
  if(c.lx!=null)html+='<div class="cablabel" style="left:'+c.lx+'px;top:'+c.ly+'px;font-size:16px">'+name+'</div>';
 }
 html+='<div class="plannote" style="left:392px;top:296px">🖥 스탠딩 컴퓨터</div>';
 html+='<div class="plannote" style="left:300px;top:440px">스탠딩컴퓨터 하단</div>';
 html+='</div><div class="legend"><span class="badge">📍</span> 표시가 찾으시는 약의 위치예요 · <b>84W·7-ICU</b> 등은 병동명, <b>초록칸</b>은 병동별 IV 칸이에요.</div>';
 return html;
}
/* fridge: 3 units side by side */
function buildFridge(hk){
 let html='<div style="overflow-x:auto"><div class="fridgerow">';
 for(const f of FRIDGES){
  html+='<div class="frunit"><h4>❄️ '+f.title+'</h4><div class="frcols">';
  for(const col of f.cols){
   html+='<div class="frcol">'+(col.label?'<div class="side">'+col.label+'</div>':'<div class="side">&nbsp;</div>');
   for(const sh of col.rows){
    const isHit=hk&&hk.cab===col.key&&(hk.coord===sh.r||hk.coord.startsWith(sh.r+'-'));
    let segs='';
    if(sh.split){
     const fh=isHit&&hk.coord===sh.r+'-앞',bh=isHit&&hk.coord===sh.r+'-뒤';
     segs='<div class="seg'+(fh?' hitseg':'')+'">'+(fh?'📍':'<span class="lab">앞</span>')+'</div><div class="seg'+(bh?' hitseg':'')+'">'+(bh?'📍':'<span class="lab">뒤</span>')+'</div>';
    }else{const ph=isHit&&hk.coord===sh.r;segs='<div class="seg'+(ph?' hitseg':'')+'">'+(ph?'📍':'')+'</div>';}
    html+='<div class="shelf'+(isHit?' hit':'')+'"><div class="no">'+sh.r+'</div>'+segs+'</div>';
   }
   html+='</div>';
  }
  html+='</div></div>';
 }
 html+='</div></div><div class="legend"><span class="badge">📍</span> 표시된 칸이 위치예요. 냉장고마다 좌·우 문, 칸마다 앞·뒤 줄로 구분됩니다.</div>';
 return html;
}
const sheet=document.getElementById('sheet'),mapscroll=document.getElementById('mapscroll');
function openMap(d){
 const p=parseLoc(d.loc);
 document.getElementById('mTitle').textContent=d.n;
 document.getElementById('mEn').textContent=d.e||'';
 document.getElementById('mLoc').textContent=(d.s==='fridge'?'❄️ 냉장 · ':'🏠 상온 · ')+d.loc;
 if(isRoom(p.cab))mapscroll.innerHTML='<div class="maptitle">📦 상온 약장 — <b>'+p.cab+' 약장</b></div>'+buildPlan(p);
 else mapscroll.innerHTML='<div class="maptitle">❄️ 냉장고 — <b>'+p.cab+'</b></div>'+buildFridge(p);
 sheet.classList.add('open');
 setTimeout(()=>{const el=mapscroll.querySelector('.hit');if(el)el.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});},120);
}
document.getElementById('close').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open');};
</script>
